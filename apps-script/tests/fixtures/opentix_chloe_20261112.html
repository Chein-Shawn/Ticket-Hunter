d-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E從新加坡走向世界頂尖古典音樂舞臺，以超越年齡的音樂成熟度、精湛技巧與極具感染力的演奏風格，成為國際樂壇備受矚目的新世代小提琴家。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003ECHLOE CHUA 蔡珂宜，2027 年首度來臺！\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E她的演奏兼具細膩與力量，既能展現令人屏息的技巧，也能以真摯而深刻的音樂語言觸動人心。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E2027 年 1 月，蔡珂宜將於高雄、臺北獻上備受期待的臺灣首演，邀請樂迷親臨現場，感受這位國際小提琴新星的非凡魅力。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E⸻\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E✦ ABOUT THE ARTIST｜關於蔡珂宜\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003ECHLOE CHUA 蔡珂宜｜小提琴家\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E來自新加坡的蔡珂宜，是當今國際古典音樂界備受關注的青年小提琴家之一。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E2018 年，年僅 11 歲的她於享譽國際的 梅紐因國際青少年小提琴大賽（Menuhin Competition）少年組榮獲並列首獎，一舉躍上國際舞臺，展現令人驚豔的音樂天賦。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E此後，她持續活躍於國際樂壇，與多個知名交響樂團合作，並受邀於亞洲及世界各地的重要音樂舞臺演出。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E她與新加坡交響樂團（Singapore Symphony Orchestra）的長期藝術合作，亦成為其音樂生涯的重要里程碑。從古典協奏曲到精緻細膩的室內樂作品，她以成熟的音樂詮釋、精準的技巧及鮮明的藝術個性，展現超越年齡的音樂深度。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E她的演出足跡橫跨新加坡、澳洲、中國、日本、韓國等地，持續以卓越的舞臺表現，吸引世界各地樂迷的目光。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E從國際大賽的耀眼新星，到活躍世界舞臺的小提琴家，蔡珂宜正以自己的音樂語言，寫下屬於新世代的精彩篇章。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E✦ THE TAIWAN DEBUT｜臺灣首演\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E這不僅是一場小提琴獨奏會，更是臺灣樂迷首次近距離感受蔡珂宜現場演奏魅力的珍貴機會。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E她的琴音時而溫柔如歌，時而璀璨奔放；每一次運弓、每一段旋律，都展現技巧與情感之間的完美平衡。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E2027 年初，讓我們在音樂廳相遇，見證這場期待已久的臺灣首演。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E⸻\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cimg alt=\"🎼\" aria-label=\"🎼\" src=\"https:\u002F\u002Ffonts.gstatic.com\u002Fs\u002Fe\u002Fnotoemoji\u002F17.0\u002F1f3bc\u002F32.png\" style=\"height: 1.2em; width: 1.2em;\"\u003E 演出資訊｜CONCERT INFORMATION\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E2027 CHLOE CHUA 蔡珂宜 臺灣首演\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cimg alt=\"📍\" aria-label=\"📍\" src=\"https:\u002F\u002Ffonts.gstatic.com\u002Fs\u002Fe\u002Fnotoemoji\u002F17.0\u002F1f4cd\u002F32.png\" style=\"height: 1.2em; width: 1.2em;\"\u003E 高雄站｜高雄市音樂館\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E2027 年 1 月 2 日（六）19:30\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cimg alt=\"📍\" aria-label=\"📍\" src=\"https:\u002F\u002Ffonts.gstatic.com\u002Fs\u002Fe\u002Fnotoemoji\u002F17.0\u002F1f4cd\u002F32.png\" style=\"height: 1.2em; width: 1.2em;\"\u003E 臺北站｜國家音樂廳\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E2027 年 1 月 3 日（日）19:30\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cimg alt=\"🎟️\" aria-label=\"🎟️\" src=\"https:\u002F\u002Ffonts.gstatic.com\u002Fs\u002Fe\u002Fnotoemoji\u002F17.0\u002F1f39f_fe0f\u002F32.png\" style=\"height: 1.2em; width: 1.2em;\"\u003E 票價資訊｜TICKET PRICES\u003C\u002Fdiv\u003E\u003Cdiv style=\"backg 55, 255);\"\u003E\u003Cimg alt=\"🔗\" aria-label=\"🔗\" src=\"https:\u002F\u002Ffonts.gstatic.com\u002Fs\u002Fe\u002Fnotoemoji\u002F17.0\u002F1f517\u002F32.png\" style=\"height: 1.2em; width: 1.2em;\"\u003E OPENTIX 官方購票連結\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Ca href=\"https:\u002F\u002Fwww.opentix.life\u002Fevent\u002F2108010089152028673\" target=\"_blank\" rel=\"noopener noreferrer\"\u003Ehttps:\u002F\u002Fwww.opentix.life\u002Fevent\u002F2108010089152028673\u003C\u002Fa\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E⸻\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E✦ THE PRODIGY’S TAIWAN DEBUT ✦\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E世界矚目的琴音，這一次，為臺灣而奏。\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cp\u003E\u003C\u002Fp\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E主辦單位｜Harmonie Music Taiwan好滿意音樂有限公司\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cspan style=\"font-size: 14px;\"\u003E⸻\u003C\u002Fspan\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E\u003Cbr\u003E\u003C\u002Fdiv\u003E\u003Cdiv style=\"background-color: rgb(255, 255, 255);\"\u003E演出曲目 Programme\u003Cbr\u003E\u003Cbr\u003E演出者 Artists\u003Cbr\u003E\n小提琴 Violin｜蔡珂宜 Chloe Chua\u003Cbr\u003E\n鋼琴 Piano｜朱利安・康坦 Julien Quentin\u003Cbr\u003E\u003Cbr\u003E⸻\u003Cbr\u003E\u003Cbr\u003E朱塞佩・塔替尼 Giuseppe Tartini\u003Cbr\u003E\nG 小調小提琴奏鳴曲《魔鬼的顫音》\u003Cbr\u003E\nViolin Sonata in G minor, “The Devil’s Trill”\u003Cbr\u003E\u003Cbr\u003E卡米爾・聖桑 Camille Saint-Saëns\u003Cbr\u003E\nD 小調第一號小提琴奏鳴曲，作品 75\u003Cbr\u003E\nViolin Sonata No. 1 in D minor, Op. 75\u003Cbr\u003E\u003Cbr\u003E—— 中場休息 Intermission ——\u003Cbr\u003E\u003Cbr\u003E歐仁・易沙意 Eugène Ysaÿe\u003Cbr\u003E\nD 小調第三號無伴奏小提琴奏鳴曲《敘事曲》，作品 27\u003Cbr\u003E\nSonata for Solo Violin No. 3 in D minor, Op. 27, “Ballade”\u003Cbr\u003E\u003Cbr\u003E路德維希・范・貝多芬 Ludwig van Beethoven\u003Cbr\u003E\nA 小調第四號小提琴奏鳴曲，作品 23\u003Cbr\u003E\nViolin Sonata No. 4 in A minor, Op. 23\u003Cbr\u003E\u003Cbr\u003E弗朗茲・瓦克斯曼 Franz Waxman\u003Cbr\u003E\n《卡門幻想曲》\u003Cbr\u003E\nCarmen Fantasie\u003Cbr\u003E\u003Cbr\u003E⸻\u003Cbr\u003E\u003Cbr\u003E※ 主辦單位保留演出曲目、演出者及演出順序異動之權利。\u003C\u002Fdiv\u003E",changeNotification:ba,organizingInformation:ba,tags:[T,bb,bc,bd],programTags:[{id:"1315615976484515844",text:T},{id:"1247440590011125761",text:bb},{id:"2108010089080725505",text:bc},{id:"2108010089090670592",text:bd}],programOrganizers:[{type:be,info:[{name:av,logoUrl:c,websiteUrl:ax,telephoneNumber:aw}]}],lastEventEndTime:af,firstEventOnlineStartTime:g,lastEventOnlineEndTime:b,seoDescription:ay,seoOrganizers:az,seoJson:[{type:aA,json:{"@context":aB,"@type":"BreadcrumbList",itemListElement:[{"@type":aC,position:f,item:{"@id":"https:\u002F\u002Fwww.opentix.life",name:"OPENTIX兩廳院文化生活",image:"https:\u002F\u002Fs3.resource.opentix.life\u002Fdefault\u002Fsharelogo.png"}},{"@type":aC,position:M,item:{"@id":"https:\u002F\u002Fwww.opentix.life\u002Fevent",name:"event"}},{"@type":aC,position:ah,item:{"@id":aD,name:ae,image:ag}}]}},{type:aA,json:{"@context":aB,"@type":bf,name:ae,description:ay,image:ag,organizer:az,startDate:"2027-01-02T19:30:00",endDate:bg,eventAttendanceMode:bh,eventStatus:bi,location:{"@type":bj,name:aM,address:{"@type":bk,streetAddress:"鹽埕區河西路99號",addressCountry:bl,addressLocality:aN}},offers:{"@type":bm,highPrice:V,lowPrice:m,priceCur
